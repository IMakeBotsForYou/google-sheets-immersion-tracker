name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit and end-to-end tests (fake Google Sheet, no secrets needed)
        run: python -m unittest discover -s tests -v
      - name: Offline demo
        run: >
          python main.py examples/sample_chat.txt
          --config examples/demo.toml --people examples/demo_people.json
          --offline --today "2026-11-01 12:00" --no-pause
